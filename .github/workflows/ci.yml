name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci --prefer-offline --no-audit --fund=false
      - run: npm run types
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run deploy:dry
      - run: node scripts/check-openapi.mjs
      - run: npm run lint:openapi
      - run: npm run openapi:gen && git diff --exit-code -- apps/worker/src/openapi-spec.ts apps/worker/src/llms-txt.ts
      # The npm package ships only the bundle; prove it builds and runs.
      - run: npm run build:cli && node apps/cli/dist/cli.mjs --version && node apps/cli/dist/cli.mjs import --help
      # The seats config is generated (gitignored) from its committed
      # template; dry-run just needs a well-formed placeholder account.
      - run: node -e "const fs=require('fs');fs.writeFileSync('apps/seats/wrangler.jsonc',fs.readFileSync('apps/seats/wrangler.jsonc.example','utf8').replace('__ACCOUNT_ID__','0123456789abcdef0123456789abcdef'))"
      - run: npx wrangler deploy --dry-run --config apps/seats/wrangler.jsonc

  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: verify
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7
      - id: gate
        # Least-privilege token for this job: `npm run token:mint -- --profile ci`
        # (Workers Scripts Edit + D1 Edit + Queues Edit, one account). See docs/TOKENS.md.
        # Docs-only PRs skip the deploy: nothing to preview, no minutes burned.
        run: |
          if [ -z "${{ secrets.CLOUDFLARE_API_TOKEN }}" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "No CLOUDFLARE_API_TOKEN secret; skipping preview deploy."
            exit 0
          fi
          BASE="${{ github.base_ref }}"
          if [ -n "$BASE" ] && git fetch -q --depth 1 origin "$BASE"; then
            CHANGED=$(git diff --name-only FETCH_HEAD...HEAD || true)
            if [ -n "$CHANGED" ] && ! printf '%s\n' "$CHANGED" | grep -qEv '^(docs/|\.github/|.*\.md$)'; then
              echo "relevant changes present"
            else
              echo "skip=true" >> "$GITHUB_OUTPUT"
              echo "Docs-only change; skipping preview deploy."
            fi
          fi
      - uses: actions/setup-node@v7
        if: steps.gate.outputs.skip != 'true'
        with:
          node-version: 24
          cache: npm
      - run: npm ci --prefer-offline --no-audit --fund=false
        if: steps.gate.outputs.skip != 'true'
      - name: Deploy branch preview
        id: preview
        if: steps.gate.outputs.skip != 'true'
        run: |
          NAME=$(echo "${{ github.head_ref }}" | tr '[:upper:]' '[:lower:]' | tr -cs 'a-z0-9-' '-' | sed 's/^-//;s/-$//' | head -c 60)
          OUT=$(npx wrangler preview --name "$NAME" 2>&1)
          echo "$OUT"
          URL=$(echo "$OUT" | grep -oE 'https://[^ ]*\.workers\.dev' | head -n 1)
          echo "preview_url=$URL" >> "$GITHUB_OUTPUT"
          echo "### Preview ready: $URL" >> "$GITHUB_STEP_SUMMARY"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
