# Redocly gates spec validity (errors fail CI). The two response-shape
# rules are off: redirect/HTML endpoints (/, /dashboard, GitHub
# callbacks, consent) truthfully have no 2xx JSON or 4xx — failures
# ride 302 query params or 200 HTML pages. JSON API response coverage
# is enforced separately by scripts/check-openapi.mjs.
rules:
  operation-2xx-response: off
  operation-4xx-response: off
