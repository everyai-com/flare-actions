                      type: string
    post:
      tags: [mcp]
      operationId: mcpRequest
      summary: MCP streamable-HTTP JSON-RPC (Bearer token or same-origin cookie)
      security:
        - bearerAuth: []
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JsonRpcRequest'
      responses:
        '200':
          description: JSON-RPC response (SSE stream when negotiated)
          content:
            application/json:
