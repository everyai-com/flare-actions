                      $ref: '#/components/schemas/ForgeMailboxMessage'
                  policyWarning:
                    type: string
                    nullable: true
                  nextSteps:
                    $ref: '#/components/schemas/ForgeNextSteps'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/ForgeConflict'
    get:
      tags:
        - forge
      operationId: forgeListIntents
