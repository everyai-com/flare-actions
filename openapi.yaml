      tags: [cloud]
      operationId: cloudGrantCredits
      summary: Grant prepaid credits (hosted Cloud ops; 501 in OSS)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amountCents]
              properties:
                amountCents:
                  type: integer
                  minimum: 1
                  maximum: 1000000000
                memo:
                  type: string
                  maxLength: 280
                ref:
                  type: string
                  maxLength: 128
                  description: Idempotency key (retried grants with the same ref credit once)
      responses:
        '200':
          description: Granted (balance after the grant)
          content:
            application/json:
              schema:
                type: object
                required: [ok, duplicate, balanceCents]
                properties:
                  ok:
                    type: boolean
                  duplicate:
                    type: boolean
                    description: True when this ref was already granted (a replay; nothing new credited)
                  balanceCents:
                    type: integer
        '409':
          description: Ref already used by a different ledger entry (different amount or a spend row)
        '501':
          description: OSS deploy (hosted_only)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
