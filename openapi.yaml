                  type: string
                  minLength: 3
                  maxLength: 200
                footprint:
                  oneOf:
                    - type: array
                      items:
                        type: string
                    - type: object
                      properties:
                        paths:
                          type: array
                          items:
                            type: string
                        entities:
                          type: array
                          items:
                            type: string
                reasoning:
                  type: string
                  maxLength: 4000
                accept:
                  type: string
                  maxLength: 1000
                goalId:
                  type: string
                baseSha:
                  type: string
