  /v1/forge/goals:
    post:
      tags:
        - forge
      operationId: forgePlanGoal
      summary: Record a goal and get a planning scaffold (plan_goal)
      description: |-
        Without `plan`, proposals come from paths named in the goal text.
        With `plan=1` (query) or `plan: true` (body) and Workers AI bound,
        the planner splits the goal into 3-12 intents grounded in the
        trunk tree, with `after` edges for unavoidable overlaps. Planner
        misses degrade to the heuristic scaffold (never a 5xx); `planner`
        says which one answered.
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - name: plan
          in: query
          required: false
          schema:
            type: string
            enum: ['1', 'true']
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - repo
                - text
              properties:
                repo:
                  type: string
                text:
                  type: string
                  maxLength: 4000
                plan:
                  type: boolean
      responses:
        '201':
          description: Goal + proposals + nearby live intents
          content:
            application/json:
              schema:
                type: object
                required:
                  - goal
                properties:
                  goal:
                    $ref: '#/components/schemas/ForgeGoal'
                  proposals:
                    type: array
                    items:
                      type: object
                  nearby:
                    type: array
                    items:
                      $ref: '#/components/schemas/ForgeLiveIntent'
                  planner:
                    type: object
                    description: Present only when `plan` was requested.
                    required:
                      - used
                    properties:
                      used:
                        type: boolean
                      model:
                        type: string
                      dropped:
                        type: integer
                        description: Model proposals rejected by validation/grounding.
                      reason:
                        type: string
                  nextSteps:
                    $ref: '#/components/schemas/ForgeNextSteps'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    get:
      tags:
        - forge
      operationId: forgeListGoals
      summary: List a repo's goals
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - name: repo
          in: query
          required: true
          schema:
            type: string
          description: Artifacts repo name (e.g. shop); token allowlists scope it as `<namespace>/<repo>`
        - name: state
          in: query
          required: false
          schema:
            type: string
          description: open | done | abandoned
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
          description: 1-200 (default 50)
      responses:
        '200':
          description: Goals, newest first
          content:
            application/json:
              schema:
                type: object
                properties:
                  repo:
                    type: string
                  goals:
                    type: array
                    items:
                      $ref: '#/components/schemas/ForgeGoal'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
