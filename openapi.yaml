        content:
          application/json:
            schema:
              type: object
              properties:
                enabled:
                  type: boolean
                muteMinutes:
                  type: integer
                  nullable: true
                  minimum: 0
                  description: Null clears the mute
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ok'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [admin]
      operationId: deleteMonitor
      summary: Delete a monitor
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ok'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/admin/generate:
    post:
      tags: [admin]
      operationId: generatePipeline
      summary: Generate flare.yml from natural language (Workers AI)
      security:
        - bearerAuth: []
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [prompt]
              properties:
                prompt:
                  type: string
                  maxLength: 2000
      responses:
        '200':
          description: Generated YAML
          content:
            application/json:
              schema:
                type: object
                required: [yaml]
                properties:
                  yaml:
                    type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '501':
          $ref: '#/components/responses/NotConfigured'
        '502':
          description: Generation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/oauth/grants:
    get:
      tags: [oauth]
      operationId: listMyGrants
      summary: List my OAuth connected apps (session cookie)
      security:
        - cookieAuth: []
      responses:
        '200':
          description: My grants with client names
          content:
            application/json:
              schema:
                type: object
                required: [grants]
                properties:
                  grants:
                    type: array
                    items:
                      $ref: '#/components/schemas/OAuthGrant'
        '401':
          $ref: '#/components/responses/Unauthorized'
    delete:
      tags: [oauth]
      operationId: revokeMyGrant
      summary: Revoke one of my OAuth grants
      security:
        - cookieAuth: []
      parameters:
        - name: grantId
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Revoked
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok:
                    type: boolean
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/admin/oauth-grants:
    get:
      tags: [admin]
      operationId: listOAuthGrants
      summary: List authorized OAuth apps (keyset-paginated)
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 100
        - name: cursor
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Grants with client names
          content:
            application/json:
              schema:
                type: object
                required: [grants]
                properties:
                  grants:
                    type: array
                    items:
                      $ref: '#/components/schemas/OAuthGrant'
                  cursor:
                    type: string
                    nullable: true
                  list_complete:
                    type: boolean
        '401':
          $ref: '#/components/responses/Unauthorized'
    delete:
      tags: [admin]
      operationId: revokeOAuthGrant
      summary: Revoke an OAuth grant (client + user)
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - name: grantId
          in: query
          required: true
          schema:
            type: string
        - name: userId
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Revoked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ok'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/admin/status:
    get:
      tags: [admin]
      operationId: dashboardStatus
      summary: Dashboard bootstrap state (claim, user, GitHub)
      security:
        - bearerAuth: []
        - cookieAuth: []
      responses:
        '200':
          description: Status snapshot (user null when logged out)
          content:
            application/json:
              schema:
                type: object
                required: [claimed, githubConnected]
                properties:
                  claimed:
                    type: boolean
                  githubConnected:
                    type: boolean
                  installUrl:
                    type: string
                    nullable: true
                  openRegistration:
                    type: boolean
                  user:
                    type: object
                    nullable: true
  /v1/admin/github/connect:
    post:
      tags: [admin]
      operationId: githubConnectBegin
      summary: Begin GitHub App creation via manifest (open pre-claim)
      security:
        - bearerAuth: []
        - cookieAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
      responses:
        '200':
          description: Manifest post URL and payload
          content:
            application/json:
              schema:
                type: object
                required: [postUrl, manifest]
                properties:
                  postUrl:
                    type: string
                  manifest:
                    type: object
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: GitHub already managed via environment
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/admin/github/callback:
    get:
      tags: [admin]
      operationId: githubConnectCallback
      summary: Manifest exchange callback (redirects to dashboard)
      security: []
      parameters:
        - name: state
          in: query
          schema:
            type: string
        - name: code
          in: query
          schema:
            type: string
      responses:
        '302':
          description: Redirect to the dashboard with the outcome
  /v1/admin/github/login:
    get:
      tags: [auth]
      operationId: githubLogin
      summary: Begin GitHub OAuth login (redirects to github.com)
      security: []
      responses:
        '302':
          description: Redirect to GitHub authorize or dashboard on error
  /v1/admin/github/oauth/callback:
    get:
      tags: [auth]
      operationId: githubOAuthCallback
      summary: GitHub OAuth callback (sets session, redirects)
      security: []
      responses:
        '302':
          description: Redirect to the dashboard with the outcome
  /webhooks/github:
    post:
      tags: [webhooks]
      operationId: githubWebhook
      summary: GitHub event ingestion (HMAC-verified, idempotent)
      security: []
      parameters:
        - name: X-Hub-Signature-256
          in: header
          required: true
          schema:
            type: string
        - name: X-GitHub-Event
          in: header
          required: true
          schema:
            type: string
        - name: X-GitHub-Delivery
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Accepted (redeliveries ack without duplicating; gated events ack with no run)
          content:
            application/json:
              schema:
                type: object
        '401':
          $ref: '#/components/responses/Unauthorized'
  /mcp:
    get:
      tags: [mcp]
      operationId: mcpDiscovery
      summary: MCP server discovery document
      security: []
      responses:
        '200':
          description: Discovery with protocol versions
          content:
            application/json:
              schema:
                type: object
                required: [name, version, protocol, protocolVersion]
                properties:
                  name:
                    type: string
                  version:
                    type: string
                  protocol:
                    type: string
                  protocolVersion:
                    type: string
                  protocolVersions:
                    type: array
                    items:
                      type: string
    post:
      tags: [mcp]
      operationId: mcpRequest
      summary: MCP streamable-HTTP JSON-RPC (Bearer token or same-origin cookie)
      security:
        - bearerAuth: []
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JsonRpcRequest'
      responses:
        '200':
          description: JSON-RPC response (SSE stream when negotiated)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JsonRpcResponse'
            text/event-stream:
              schema:
                type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '406':
          description: Missing dual Accept header
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /authorize:
    get:
      tags: [oauth]
      operationId: oauthAuthorize
      summary: OAuth consent page (session-authenticated browser flow)
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Consent HTML
          content:
            text/html:
              schema:
                type: string
        '302':
          description: Redirect (login or back to client)
    post:
      tags: [oauth]
      operationId: oauthConsent
      summary: Approve or deny the OAuth consent
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
      responses:
        '200':
          description: HTML error page (expired transaction, bad decision)
          content:
            text/html:
              schema:
                type: string
        '302':
          description: Redirect back to the client
  /oauth/token:
    post:
      tags: [oauth]
      operationId: oauthToken
      summary: Token endpoint (authorization_code, refresh_token, client_credentials)
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
      responses:
        '200':
          description: Token response
          content:
            application/json:
              schema:
                type: object
        '400':
          $ref: '#/components/responses/BadRequest'
  /oauth/register:
    post:
      tags: [oauth]
      operationId: oauthRegister
      summary: Dynamic client registration (RFC 7591)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '201':
          description: Registered client
          content:
            application/json:
              schema:
                type: object
        '400':
          $ref: '#/components/responses/BadRequest'
  /.well-known/oauth-authorization-server:
    get:
      tags: [oauth]
      operationId: oauthServerMetadata
      summary: Authorization server metadata (RFC 8414)
      security: []
      responses:
        '200':
          description: Server metadata
          content:
            application/json:
              schema:
                type: object
  /.well-known/oauth-protected-resource:
    get:
      tags: [oauth]
      operationId: protectedResourceMetadata
      summary: Protected resource metadata (RFC 9728)
      security: []
      responses:
        '200':
          description: Resource metadata
          content:
            application/json:
              schema:
                type: object
  /.well-known/oauth-protected-resource/mcp:
    get:
      tags: [oauth]
      operationId: mcpResourceMetadata
      summary: MCP-scoped protected resource metadata
      security: []
      responses:
        '200':
          description: Resource metadata
          content:
            application/json:
              schema:
                type: object
  /dashboard:
    get:
      tags: [admin]
      operationId: dashboard
      summary: Dashboard HTML application
      security: []
      responses:
        '200':
          description: Dashboard HTML
          content:
            text/html:
              schema:
                type: string
  /openapi.yaml:
    get:
      tags: [admin]
      operationId: openapiSpec
      summary: This API contract, served live
      security: []
      responses:
        '200':
          description: The OpenAPI YAML
          content:
            text/yaml:
              schema:
                type: string
  /docs:
    get:
      tags: [admin]
      operationId: apiDocs
      summary: Interactive API reference (Redoc over /openapi.yaml)
      security: []
      responses:
        '200':
          description: Reference HTML
          content:
            text/html:
              schema:
                type: string
  /:
    get:
      tags: [admin]
      operationId: root
      summary: Redirect to the dashboard
      security: []
      responses:
        '302':
          description: Redirect to /dashboard
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: API token (admin, runner, or readonly scope)
    cookieAuth:
      type: apiKey
      in: cookie
      name: flare_session
      description: Dashboard session cookie (admin routes, MCP, OAuth consent)
  parameters:
    RunId:
      name: runId
      in: path
      required: true
      schema:
        type: string
    JobId:
      name: jobId
      in: path
      required: true
      schema:
        type: string
    TournamentId:
      name: tournamentId
      in: path
      required: true
      schema:
        type: string
    Limit50:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    Offset:
      name: offset
      in: query
      schema:
        type: integer
        minimum: 0
        maximum: 100000
        default: 0
  responses:
    BadRequest:
      description: Invalid input
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Missing or invalid credentials
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: Valid credentials, out of scope
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Unknown id (or out-of-scope repo, indistinguishably)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    RateLimited:
      description: Too many attempts
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    TooLarge:
      description: Body exceeds the endpoint cap
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotConfigured:
      description: Optional binding not configured
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
    Tournament:
      type: object
      required: [id, intent, source_repo, state]
      properties:
        id:
          type: string
        intent:
          type: string
        source_repo:
          type: string
        base_ref:
          type: string
        base_sha:
          type: string
        state:
          type: string
          enum: [open, verifying, decided]
        winner_run_id:
          type: string
          nullable: true
        resolved_sha:
          type: string
          nullable: true
    TournamentAttempt:
      type: object
      required: [id, agent, fork_repo, state]
      properties:
        id:
          type: string
        agent:
          type: string
        fork_repo:
          type: string
        state:
          type: string
          enum: [claimed, pushing, verifying, terminal]
        last_seen_sha:
          type: string
        run_id:
          type: string
          nullable: true
        verdict_rank:
          type: integer
          nullable: true
    TournamentBoard:
      type: object
      required: [tournament, attempts, ledger]
      properties:
        tournament:
          $ref: '#/components/schemas/Tournament'
        attempts:
          type: array
          items:
            $ref: '#/components/schemas/TournamentAttempt'
        verdict:
          type: object
          nullable: true
        ledger:
          type: array
          items:
            type: object
    Ok:
      type: object
      required: [ok]
      properties:
        ok:
          type: boolean
    OAuthGrant:
      type: object
      required: [grantId, userId, clientId, scope]
      properties:
        grantId:
          type: string
        userId:
          type: string
        clientId:
          type: string
        clientName:
          type: string
          nullable: true
        scope:
          type: array
          items:
            type: string
        scopeDescriptions:
          type: array
          items:
            type: string
        createdAt:
          type: number
          nullable: true
    Run:
      type: object
      required: [id, repo, sha, event, status, created_at, updated_at]
      properties:
        id:
          type: string
        repo:
          type: string
        sha:
          type: string
        event:
          type: string
        installation_id:
          type: integer
          nullable: true
        branch:
          type: string
        source:
          type: string
          nullable: true
        pr_number:
          type: integer
          nullable: true
        pr_comment_id:
          type: integer
          nullable: true
        heal_branch:
          type: string
          nullable: true
        heal_pr_url:
          type: string
          nullable: true
        status:
          type: string
          enum: [queued, running, blocked, success, failure, error, cancelled, skipped]
        created_at:
          type: string
        updated_at:
          type: string
    Job:
      type: object
      required: [id, run_id, status]
      properties:
        id:
          type: string
        run_id:
          type: string
        name:
          type: string
        status:
          type: string
          enum: [queued, running, blocked, success, failure, error, cancelled, skipped]
        log:
          type: string
        definition:
          type: string
        result:
          type: string
        triage:
          type: string
        labels:
          type: string
        priority:
          type: integer
        attempts:
          type: integer
        started_at:
          type: string
          nullable: true
        finished_at:
          type: string
          nullable: true
        retained_until:
          type: string
          nullable: true
        prior_ms:
          type: integer
        created_at:
          type: string
        updated_at:
          type: string
        durationMs:
          type: number
          nullable: true
    CostSummary:
      type: object
      description: Cost attribution rollup for a run's jobs
    RunDigest:
      type: object
      required: [runId, repo, sha, branch, event, status, totalJobs, failedJobs, jobs]
      properties:
        runId:
          type: string
        repo:
          type: string
        sha:
          type: string
        branch:
          type: string
        event:
          type: string
        status:
          type: string
        durationMs:
          type: number
          nullable: true
        totalJobs:
          type: integer
        failedJobs:
          type: integer
        jobs:
          type: array
          items:
            $ref: '#/components/schemas/DigestJob'
        egress:
          $ref: '#/components/schemas/DigestEgress'
        heal:
          type: object
          properties:
            branch:
              type: string
            prUrl:
              type: string
    DigestJob:
      type: object
      required: [id, name, status, stepCount]
      properties:
        id:
          type: string
        name:
          type: string
        status:
          type: string
        durationMs:
          type: number
          nullable: true
        stepCount:
          type: integer
        failing:
          $ref: '#/components/schemas/DigestStep'
        triage:
          type: string
        retainedUntil:
          type: string
    DigestStep:
      type: object
      required: [command, exitCode, durationMs, outputTail]
      properties:
        command:
          type: string
        exitCode:
          type: number
        durationMs:
          type: number
        outputTail:
          type: string
    DigestEgress:
      type: object
      required: [reqBytes, respBytes, topHosts]
      properties:
        reqBytes:
          type: number
        respBytes:
          type: number
        topHosts:
          type: array
          items:
            type: object
            required: [host, reqBytes, respBytes]
            properties:
              host:
                type: string
              reqBytes:
                type: number
              respBytes:
                type: number
    Artifact:
      type: object
      description: Artifact entry (job id, name, size)
    FlakyStat:
      type: object
      description: Per-job failure rate row (job, runs, failures, rate)
    UsageStats:
      type: object
      description: Compute minutes and cost attribution rollup
    LogHit:
      type: object
      description: FTS log match (run, job, line, rank)
    ByteTotals:
      type: object
      required: [reqBytes, respBytes]
      properties:
        reqBytes:
          type: number
        respBytes:
          type: number
    RunTests:
      type: object
      required: [runId, totals, jobs, failing]
      properties:
        runId:
          type: string
        totals:
          $ref: '#/components/schemas/TestTotals'
        jobs:
          type: array
          items:
            $ref: '#/components/schemas/JobTestCounts'
        failing:
          type: array
          items:
            $ref: '#/components/schemas/FailingTest'
    TestTotals:
      type: object
      required: [total, passed, failed, errors, skipped]
      properties:
        total:
          type: integer
        passed:
          type: integer
        failed:
          type: integer
        errors:
          type: integer
        skipped:
          type: integer
    JobTestCounts:
      type: object
      required: [jobId, jobName, total, passed, failed, errors, skipped]
      properties:
        jobId:
          type: string
        jobName:
          type: string
        total:
          type: integer
        passed:
          type: integer
        failed:
          type: integer
        errors:
          type: integer
        skipped:
          type: integer
        durationMs:
          type: number
        truncated:
          type: boolean
    FailingTest:
      type: object
      required: [jobId, jobName, name, status]
      properties:
        jobId:
          type: string
        jobName:
          type: string
        suite:
          type: string
        name:
          type: string
        classname:
          type: string
        status:
          type: string
        message:
          type: string
    ApiToken:
      type: object
      required: [id, name, scopes]
      properties:
        id:
          type: string
        name:
          type: string
        scopes:
          type: array
          items:
            type: string
        repos:
          type: array
          items:
            type: string
        created_at:
          type: string
        revoked_at:
          type: string
          nullable: true
    Settings:
      type: object
      description: Dashboard settings snapshot (see GET /v1/admin/settings)
    EmailUser:
      type: object
      required: [email, isAdmin, createdAt]
      properties:
        email:
          type: string
        isAdmin:
          type: boolean
        createdAt:
          type: string
    AuditEntry:
      type: object
      required: [id, actor, action, created_at]
      properties:
        id:
          type: string
        actor:
          type: string
        action:
          type: string
        target:
          type: string
        created_at:
          type: string
    QueuedJob:
      type: object
      required: [id, runId, name, repo]
      properties:
        id:
          type: string
        runId:
          type: string
        name:
          type: string
        repo:
          type: string
        priority:
          type: integer
        priorMs:
          type: number
        labels:
          type: string
        createdAt:
          type: string
    Schedule:
      type: object
      required: [id, repo, ref, cron, enabled]
      properties:
        id:
          type: string
        repo:
          type: string
        ref:
          type: string
        cron:
          type: string
