# Flare Actions API — OpenAPI 3.0 contract for the v1 surface.
# Source of truth for docs, client validation, and agent tools; the
# ordered prerequisite for any Forge generation pipeline evaluation.
# Coverage is enforced: scripts/check-openapi.mjs fails CI when a
# route in apps/worker/src/index.ts has no path entry here.
openapi: 3.0.3
info:
  title: Flare Actions API
  version: 1.0.0
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  description: |-
    GitHub Actions alternative on Cloudflare. Token scopes: `admin`
    (everything), `runner` (run + read), `readonly` (read). Tokens
    carry an optional repo allowlist (empty = all repos); out-of-scope
    repos answer 403, unknown ids answer 404. All errors are
    `{"error": string}`; admin dashboard routes also accept the
    `flare_session` cookie.
servers:
  - url: https://flare-actions.everyai-com.workers.dev
tags:
  - name: runs
    description: Run lifecycle, digests, waits, cancellation
  - name: jobs
    description: Runner claims, status callbacks, heartbeats, reruns
  - name: artifacts
    description: Per-job build artifacts over R2
  - name: cache
    description: Build cache over R2
  - name: tests
    description: JUnit test reports and per-run rollups
  - name: analytics
    description: Flaky rates, usage, log search, egress, badges
  - name: admin
    description: Admin-only dashboard APIs (token or session)
  - name: auth
    description: Login, registration, invites, password reset
  - name: oauth
    description: MCP OAuth provider (AS+RS) and client metadata
  - name: mcp
    description: MCP streamable-HTTP endpoint
  - name: webhooks
    description: GitHub event ingestion
security:
  - bearerAuth: []
paths:
  /v1/runs:
    get:
      tags: [runs]
      operationId: listRuns
      summary: List runs, newest first
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Limit50'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Paginated runs (repo-scoped tokens see only their repos)
          content:
            application/json:
              schema:
                type: object
                required: [runs]
                properties:
                  runs:
                    type: array
                    items:
                      $ref: '#/components/schemas/Run'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/runs/dispatch:
    post:
      tags: [runs]
      operationId: dispatchRun
      summary: Dispatch a run for repo@sha (SHA, branch, or tag)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [repo, sha]
              properties:
                repo:
                  type: string
                  description: owner/name
                sha:
                  type: string
                  description: Commit SHA, branch, or tag (max 128 chars)
                ref:
                  type: string
                  description: Optional branch label (max 128 chars)
                pipeline:
                  type: string
                  description: Inline flare.yml (skips the repo fetch)
                priority:
                  type: integer
                  minimum: 0
                  maximum: 10
                  default: 0
                  description: Agent fast lane (10 jumps batch work)
                source:
                  type: string
                  description: Uploaded working-tree id (requires inline pipeline)
      responses:
        '202':
          description: Run accepted
          content:
            application/json:
              schema:
                type: object
                required: [runId, jobIds]
                properties:
                  runId:
                    type: string
                  jobIds:
                    type: array
                    items:
                      type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /v1/runs/{runId}:
    get:
      tags: [runs]
      operationId: getRun
      summary: Get a run with jobs and cost summary
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RunId'
      responses:
        '200':
          description: Run detail
          content:
            application/json:
              schema:
                type: object
                required: [run, jobs, summary]
                properties:
                  run:
                    $ref: '#/components/schemas/Run'
                  jobs:
                    type: array
                    items:
                      $ref: '#/components/schemas/Job'
                  summary:
                    $ref: '#/components/schemas/CostSummary'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/runs/{runId}/wait:
    get:
      tags: [runs]
      operationId: waitRun
      summary: Block until the run is terminal (replaces poll loops)
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RunId'
        - name: timeout
          in: query
          schema:
            type: number
            minimum: 1
            maximum: 90
            default: 30
          description: Server-side wait budget in seconds
      responses:
        '200':
          description: Terminal (or timed-out) run state
          content:
            application/json:
              schema:
                type: object
                required: [run, jobs, summary, timedOut, waitedMs]
                properties:
                  run:
                    $ref: '#/components/schemas/Run'
                  jobs:
                    type: array
                    items:
                      $ref: '#/components/schemas/Job'
                  summary:
                    $ref: '#/components/schemas/CostSummary'
                  timedOut:
                    type: boolean
                  waitedMs:
                    type: number
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/runs/{runId}/digest:
    get:
      tags: [runs]
      operationId: getRunDigest
      summary: Token-efficient run digest for agents (no full logs)
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RunId'
      responses:
        '200':
          description: Structured digest with failing steps and triage
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunDigest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/tournaments:
    post:
      tags: [tournaments]
      operationId: createTournament
      summary: Open a tournament racing agents on one task
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [intent, sourceRepo]
              properties:
                intent:
                  type: string
                  description: Task description (1-2000 chars)
                sourceRepo:
                  type: string
                  description: Repo name in the bound Artifacts namespace
                baseRef:
                  type: string
                  description: Base branch (default main)
                baseSha:
                  type: string
                  description: Pinned base commit (optional)
      responses:
        '201':
          description: Tournament id
          content:
            application/json:
              schema:
                type: object
                required: [id]
                properties:
                  id:
                    type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    get:
      tags: [tournaments]
      operationId: listTournaments
      summary: List recent tournaments
      security:
        - bearerAuth: []
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: Tournaments newest first
          content:
            application/json:
              schema:
                type: object
                required: [tournaments]
                properties:
                  tournaments:
                    type: array
                    items:
                      $ref: '#/components/schemas/Tournament'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/tournaments/{tournamentId}:
    get:
      tags: [tournaments]
      operationId: getTournamentBoard
      summary: Tournament board (attempts, verdict, ledger)
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/TournamentId'
      responses:
        '200':
          description: Board state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TournamentBoard'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/tournaments/{tournamentId}/claims:
    post:
      tags: [tournaments]
      operationId: claimTournamentSlot
      summary: Claim an agent slot (forks the source)
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/TournamentId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [agent]
              properties:
                agent:
                  type: string
                  description: Agent label matching [\w.-]{1,40}
      responses:
        '201':
          description: Claim with fork repo + remote
          content:
            application/json:
              schema:
                type: object
                required: [attemptId, forkRepo, remote]
                properties:
                  attemptId:
                    type: string
                  forkRepo:
                    type: string
                  remote:
                    type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: Slot already claimed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '502':
          description: Fork failed upstream
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          $ref: '#/components/responses/NotConfigured'
  /v1/admin/tournaments/tick:
    post:
      tags: [tournaments]
      operationId: tickTournaments
      summary: Run one tournament-machine tick (admin)
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Per-pass counts
          content:
            application/json:
              schema:
                type: object
                required: [polled, verdicts, resolved, pushed]
                properties:
                  polled:
                    type: object
                    required: [dispatched, terminal]
                    properties:
                      dispatched:
                        type: integer
                      terminal:
                        type: integer
                  verdicts:
                    type: object
                    required: [decided]
                    properties:
                      decided:
                        type: integer
                  resolved:
                    type: object
                    required: [resolved]
                    properties:
                      resolved:
                        type: integer
                  pushed:
                    type: object
                    required: [pushed]
                    properties:
                      pushed:
                        type: integer
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/runs/{runId}/cancel:
    post:
      tags: [runs]
      operationId: cancelRun
      summary: Cancel a run's queued and blocked jobs
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RunId'
      responses:
        '200':
          description: Cancellation count
          content:
            application/json:
              schema:
                type: object
                required: [ok, cancelled]
                properties:
                  ok:
                    type: boolean
                  cancelled:
                    type: integer
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/runs/{runId}/status:
    post:
      tags: [jobs]
      operationId: postJobStatus
      summary: Executor status callback (running/terminal transitions)
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RunId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [jobId, status]
              properties:
                jobId:
                  type: string
                status:
                  type: string
                  enum: [running, success, failure, error, cancelled]
                log:
                  type: string
                  description: Full log (capped server-side at 256KB)
                result:
                  type: string
                  description: JSON step results (capped at 64KB)
      responses:
        '200':
          description: Recorded (dropped=true when the report belongs to a superseded execution)
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok:
                    type: boolean
                  dropped:
                    type: boolean
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/runs/{runId}/artifacts:
    get:
      tags: [artifacts]
      operationId: listRunArtifacts
      summary: List a run's artifacts across jobs
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RunId'
      responses:
        '200':
          description: Artifact entries
          content:
            application/json:
              schema:
                type: object
                required: [artifacts]
                properties:
                  artifacts:
                    type: array
                    items:
                      $ref: '#/components/schemas/Artifact'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '501':
          $ref: '#/components/responses/NotConfigured'
  /v1/runs/{runId}/tests:
    get:
      tags: [tests]
      operationId: getRunTests
      summary: Per-run JUnit rollup with failing cases
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RunId'
      responses:
        '200':
          description: Totals, per-job counts, and failing cases (max 50)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunTests'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/runs/{runId}/egress:
    get:
      tags: [analytics]
      operationId: getRunEgress
      summary: Per-job network egress accounting
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RunId'
      responses:
        '200':
          description: Byte totals and per-host rows
          content:
            application/json:
              schema:
                type: object
                required: [runId, totals, jobs]
                properties:
                  runId:
                    type: string
                  totals:
                    $ref: '#/components/schemas/ByteTotals'
                  jobs:
                    type: array
                    items:
                      type: object
                      required: [jobId, host, reqBytes, respBytes]
                      properties:
                        jobId:
                          type: string
                        host:
                          type: string
                        reqBytes:
                          type: number
                        respBytes:
                          type: number
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/runs/{runId}/jobs/{jobId}/heartbeat:
    post:
      tags: [jobs]
      operationId: jobHeartbeat
      summary: Liveness heartbeat (stale claims requeue after 20m quiet)
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RunId'
        - $ref: '#/components/parameters/JobId'
      responses:
        '200':
          description: Heartbeat recorded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ok'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/runs/{runId}/jobs/{jobId}/rerun:
    post:
      tags: [jobs]
      operationId: rerunJob
      summary: Reset a finished job to queued for re-execution
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RunId'
        - $ref: '#/components/parameters/JobId'
      responses:
        '200':
          description: Job requeued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ok'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/jobs/next:
    get:
      tags: [jobs]
      operationId: claimNextJob
      summary: Claim the next label-matched queued job (runner poll)
      security:
        - bearerAuth: []
      parameters:
        - name: labels
          in: query
          schema:
            type: string
          description: Comma-separated runner labels (os, arch, extras)
      responses:
        '200':
          description: "Claimed job with repo secrets, or {job: null} when empty"
          content:
            application/json:
              schema:
                type: object
                required: [job]
                properties:
                  job:
                    type: object
                    nullable: true
                    description: Claimed job row (null when the queue is empty)
                  secrets:
                    type: object
                    additionalProperties:
                      type: string
                    description: Decrypted repo secrets (claim only, never on read APIs)
                  secretsError:
                    type: boolean
                    description: True when secret rows were undecryptable
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/jobs/{jobId}/artifacts/{name}:
    get:
      tags: [artifacts]
      operationId: downloadArtifact
      summary: Download a job artifact by name
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/JobId'
        - name: name
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Artifact bytes
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [artifacts]
      operationId: uploadArtifact
      summary: Upload a job artifact by name
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/JobId'
        - name: name
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        '200':
          description: Artifact stored
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ok'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '413':
          $ref: '#/components/responses/TooLarge'
  /v1/jobs/{jobId}/tests:
    put:
      tags: [tests]
      operationId: uploadTestReport
      summary: Upload a JUnit XML report for a job
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/JobId'
      requestBody:
        required: true
        content:
          application/xml:
            schema:
              type: string
      responses:
        '200':
          description: Parsed counts
          content:
            application/json:
              schema:
                type: object
                required: [ok, jobId, total, passed, failed, errors, skipped, truncated]
                properties:
                  ok:
                    type: boolean
                  jobId:
                    type: string
                  total:
                    type: integer
                  passed:
                    type: integer
                  failed:
                    type: integer
                  errors:
                    type: integer
                  skipped:
                    type: integer
                  truncated:
                    type: boolean
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '413':
          $ref: '#/components/responses/TooLarge'
  /v1/cache/{key}:
    get:
      tags: [cache]
      operationId: getCache
      summary: Fetch a cache tarball by key
      security:
        - bearerAuth: []
      parameters:
        - name: key
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Cache bytes
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [cache]
      operationId: putCache
      summary: Store a cache tarball by key
      security:
        - bearerAuth: []
      parameters:
        - name: key
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        '200':
          description: Cache stored
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ok'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '413':
          $ref: '#/components/responses/TooLarge'
  /v1/source:
    post:
      tags: [runs]
      operationId: uploadSource
      summary: Upload a working-tree tarball for source dispatch (50MB cap)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        '200':
          description: Source id for dispatch (7-day retention)
          content:
            application/json:
              schema:
                type: object
                required: [source]
                properties:
                  source:
                    type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '413':
          $ref: '#/components/responses/TooLarge'
  /v1/source/{id}:
    get:
      tags: [runs]
      operationId: downloadSource
      summary: Download an uploaded working-tree tarball
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Tarball bytes
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/bottlenecks:
    get:
      tags: [analytics]
      operationId: bottleneckStats
      summary: Slowest checks for a repo (p50/p95 run time + median queue wait)
      security:
        - bearerAuth: []
      parameters:
        - name: repo
          in: query
          required: true
          schema:
            type: string
          description: owner/name
        - name: days
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 90
            default: 14
      responses:
        '200':
          description: Per-check timings
          content:
            application/json:
              schema:
                type: object
                required: [repo, days, checks]
                properties:
                  repo:
                    type: string
                  days:
                    type: integer
                  checks:
                    type: array
                    items:
                      type: object
                      required: [check, jobs, p50Ms, p95Ms, queueP50Ms, failures]
                      properties:
                        check:
                          type: string
                        jobs:
                          type: integer
                        p50Ms:
                          type: number
                        p95Ms:
                          type: number
                        queueP50Ms:
                          type: number
                        failures:
                          type: integer
  /v1/flaky:
    get:
      tags: [analytics]
      operationId: flakyStats
      summary: Per-job failure rates for a repo, worst first
      security:
        - bearerAuth: []
      parameters:
        - name: repo
          in: query
          required: true
          schema:
            type: string
          description: owner/name
        - name: days
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 365
            default: 30
      responses:
        '200':
          description: Flaky statistics
          content:
            application/json:
              schema:
                type: object
                required: [stats]
                properties:
                  stats:
                    type: array
                    items:
                      $ref: '#/components/schemas/FlakyStat'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /v1/usage:
    get:
      tags: [analytics]
      operationId: usageStats
      summary: Compute usage (minutes, cost attribution) over a window
      security:
        - bearerAuth: []
      parameters:
        - name: days
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 365
            default: 30
        - name: repo
          in: query
          schema:
            type: string
          description: Optional owner/name filter
      responses:
        '200':
          description: Usage rollup
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsageStats'
        '400':
