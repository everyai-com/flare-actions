  /v1/usage/billable:
    get:
      tags: [analytics]
      operationId: billableUsage
      summary: Real Cloudflare spend via the Billable Usage API (admin)
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - name: days
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 365
            default: 30
      responses:
        '200':
          description: "Billable rollup, or {configured:false} without credentials"
          content:
            application/json:
              schema:
                type: object
                required: [configured]
                properties:
                  configured:
                    type: boolean
                  currency:
                    type: string
                  from:
                    type: string
                  to:
                    type: string
                  totalCost:
                    type: number
                  families:
                    type: array
                    items:
                      type: object
                      required: [family, cost, rows]
                      properties:
                        family:
                          type: string
                        cost:
                          type: number
                        rows:
                          type: integer
                  skippedRows:
                    type: integer
                  truncated:
                    type: boolean
                    description: "True when the vendor returned more than the 2000-row cap; totals cover the first 2000 only"
                  totalRows:
                    type: integer
                  r2:
                    type: object
                    nullable: true
                    description: "R2 bandwidth pairing (null when the token lacks Account Analytics Read)"
                    required: [from, to, ingressBytes, egressBytes, buckets]
                    properties:
                      from:
                        type: string
                      to:
                        type: string
                      ingressBytes:
                        type: integer
                      egressBytes:
                        type: integer
                      buckets:
                        type: array
                        items:
                          type: object
                          required: [bucket, ingressBytes, egressBytes]
                          properties:
                            bucket:
                              type: string
                            ingressBytes:
                              type: integer
                            egressBytes:
                              type: integer
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '502':
          description: Billable usage unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
