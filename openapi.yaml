      responses:
        '200':
          description: HTML error page (expired transaction, bad decision)
          content:
            text/html:
              schema:
                type: string
        '302':
          description: Redirect back to the client
  /oauth/token:
    post:
      tags: [oauth]
      operationId: oauthToken
      summary: Token endpoint (authorization_code, refresh_token, client_credentials)
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
      responses:
        '200':
          description: Token response
          content:
            application/json:
              schema:
                type: object
        '400':
          $ref: '#/components/responses/BadRequest'
  /oauth/register:
    post:
      tags: [oauth]
      operationId: oauthRegister
      summary: Dynamic client registration (RFC 7591)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '201':
          description: Registered client
          content:
            application/json:
              schema:
                type: object
        '400':
          $ref: '#/components/responses/BadRequest'
  /.well-known/oauth-authorization-server:
    get:
      tags: [oauth]
      operationId: oauthServerMetadata
      summary: Authorization server metadata (RFC 8414)
      security: []
      responses:
        '200':
          description: Server metadata
          content:
            application/json:
              schema:
                type: object
  /.well-known/oauth-protected-resource:
    get:
      tags: [oauth]
      operationId: protectedResourceMetadata
      summary: Protected resource metadata (RFC 9728)
      security: []
      responses:
        '200':
          description: Resource metadata
          content:
            application/json:
              schema:
                type: object
  /.well-known/oauth-protected-resource/mcp:
    get:
      tags: [oauth]
      operationId: mcpResourceMetadata
      summary: MCP-scoped protected resource metadata
      security: []
      responses:
        '200':
          description: Resource metadata
          content:
            application/json:
              schema:
                type: object
  /dashboard:
    get:
      tags: [admin]
      operationId: dashboard
      summary: Dashboard HTML application
      security: []
      responses:
        '200':
          description: Dashboard HTML
          content:
            text/html:
              schema:
                type: string
  /openapi.yaml:
    get:
      tags: [admin]
      operationId: openapiSpec
      summary: This API contract, served live
      security: []
      responses:
        '200':
          description: The OpenAPI YAML
          content:
            text/yaml:
              schema:
                type: string
  /docs:
    get:
      tags: [admin]
      operationId: apiDocs
      summary: Interactive API reference (Redoc over /openapi.yaml)
      security: []
      responses:
        '200':
          description: Reference HTML
