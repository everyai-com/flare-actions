  /v1/setup:
    get:
      tags: [admin]
      operationId: getSetup
      summary: Guided setup state for the dashboard Home screen
      description: |-
        Which setup steps are done (account, GitHub, repos, first run,
        first green run), the next one, the repos the GitHub App can see
        (pick-list for dispatch; null when unknown), and whether queued
        jobs have waited 90s+ for a machine. Runs and repos are scoped to
        the token's repo allowlist. GitHub lookups are best-effort.
      security:
        - bearerAuth: []
        - cookieAuth: []
      responses:
        '200':
          description: Setup state
          content:
            application/json:
              schema:
                type: object
                required: [steps, done, total, complete, next, waitingForComputer, githubConnected, runs, passed, admin]
                properties:
                  steps:
                    type: array
                    items:
                      type: object
                      required: [id, done]
                      properties:
                        id:
                          type: string
                          enum: [account, github, repos, first_run, green]
                        done:
                          type: boolean
                  done:
                    type: integer
                  total:
                    type: integer
                  complete:
                    type: boolean
                  next:
                    type: string
                    nullable: true
                  waitingForComputer:
                    type: boolean
                  githubConnected:
                    type: boolean
                  installUrl:
                    type: string
                    nullable: true
                  repos:
                    type: array
                    nullable: true
                    items:
                      type: object
                      required: [fullName, defaultBranch, private]
                      properties:
                        fullName:
                          type: string
                        defaultBranch:
                          type: string
                        private:
                          type: boolean
                  runs:
                    type: integer
                  passed:
                    type: integer
                  latest:
                    type: object
                    nullable: true
                    properties:
                      id:
                        type: string
                      repo:
                        type: string
                      branch:
                        type: string
                      status:
                        type: string
                      createdAt:
                        type: string
                  executorSeen:
                    type: boolean
                  admin:
                    type: boolean
        '401':
          $ref: '#/components/responses/Unauthorized'
