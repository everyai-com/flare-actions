# Flare Actions API — OpenAPI 3.0 contract for the v1 surface.
# Source of truth for docs, client validation, and agent tools; the
# ordered prerequisite for any Forge generation pipeline evaluation.
# Coverage is enforced: scripts/check-openapi.mjs fails CI when a
# route in apps/worker/src/index.ts has no path entry here.
openapi: 3.0.3
info:
  title: Flare Actions API
  version: 1.0.0
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  description: |-
    GitHub Actions alternative on Cloudflare. Token scopes: `admin`
    (everything), `runner` (run + read), `readonly` (read). Tokens
    carry an optional repo allowlist (empty = all repos); out-of-scope
    repos answer 403, unknown ids answer 404. All errors are
    `{"error": string}`; admin dashboard routes also accept the
    `flare_session` cookie.
servers:
  - url: https://flare-actions.everyai-com.workers.dev
tags:
  - name: runs
    description: Run lifecycle, digests, waits, cancellation
  - name: jobs
    description: Runner claims, status callbacks, heartbeats, reruns
  - name: artifacts
    description: Per-job build artifacts over R2
  - name: cache
    description: Build cache over R2
  - name: tests
    description: JUnit test reports and per-run rollups
  - name: analytics
    description: Flaky rates, usage, log search, egress, badges
  - name: admin
    description: Admin-only dashboard APIs (token or session)
  - name: auth
    description: Login, registration, invites, password reset
  - name: oauth
    description: MCP OAuth provider (AS+RS) and client metadata
  - name: mcp
    description: MCP streamable-HTTP endpoint
  - name: webhooks
    description: GitHub event ingestion
  - name: forge
    description: Flare Forge intent-native git (goals, intents, conflicts, trains, why, live map)
  - name: templates
    description: Starter pipeline gallery and Actions migration
security:
  - bearerAuth: []
paths:
  /v1/runs:
    get:
      tags: [runs]
      operationId: listRuns
      summary: List runs, newest first
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Limit50'
        - $ref: '#/components/parameters/Offset'
        - name: agent
          in: query
          schema:
            type: string
          description: Only runs tagged with this agent identity
        - name: repo
          in: query
          schema:
            type: string
          description: Only runs for this exact repo
      responses:
        '200':
          description: Paginated runs (repo-scoped tokens see only their repos)
          content:
            application/json:
              schema:
                type: object
                required: [runs]
                properties:
                  runs:
                    type: array
                    items:
                      $ref: '#/components/schemas/Run'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/templates:
    get:
      tags: [templates]
      operationId: listTemplates
      summary: List bundled pipeline templates (gallery metadata, no YAML)
      security:
        - bearerAuth: []
      responses:
        '200':
          description: One starter per stack
          content:
            application/json:
              schema:
                type: object
                required: [templates]
                properties:
                  templates:
                    type: array
                    items:
                      $ref: '#/components/schemas/TemplateMeta'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/templates/{templateId}:
    get:
      tags: [templates]
      operationId: getTemplate
      summary: Fetch one template with its starter flare.yml
      security:
        - bearerAuth: []
      parameters:
        - name: templateId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Template with starter YAML
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Template'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/migrate:
    post:
      tags: [templates]
      operationId: migrateWorkflow
      summary: Convert a GitHub Actions workflow to flare.yml (pure, zero writes)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [workflow]
              properties:
                workflow:
                  type: string
                  description: Actions workflow YAML, 64 KiB max
                filename:
                  type: string
                  description: Original filename for context (128 chars max)
      responses:
        '200':
          description: Converted pipeline plus importer warnings
          content:
            application/json:
              schema:
                type: object
                required: [filename, yaml, warnings]
                properties:
                  filename:
                    type: string
                  yaml:
                    type: string
                  warnings:
                    type: array
                    items:
                      type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/feed:
    get:
      tags: [runs]
      operationId: getFeed
      summary: Latest runs across repos with their failed jobs (dashboard feed)
      security:
        - bearerAuth: []
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
        - name: agent
          in: query
          schema:
            type: string
          description: Only runs tagged with this agent identity
      responses:
        '200':
          description: Feed items, newest first (repo-scoped tokens see only their repos)
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/FeedItem'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/runs/dispatch:
    post:
      tags: [runs]
      operationId: dispatchRun
      summary: Dispatch a run for repo@sha (SHA, branch, or tag)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [repo, sha]
              properties:
                repo:
                  type: string
                  description: owner/name
                sha:
                  type: string
                  description: Commit SHA, branch, or tag (max 128 chars)
                ref:
                  type: string
                  description: Optional branch label (max 128 chars)
                pipeline:
                  type: string
                  description: Inline flare.yml (skips the repo fetch)
                priority:
                  type: integer
                  minimum: 0
                  maximum: 10
                  default: 0
                  description: Agent fast lane (10 jumps batch work)
                source:
                  type: string
                  description: Uploaded working-tree id (requires inline pipeline)
                agent:
                  type: string
                  description: Agent identity tag for per-agent caps + attribution (1-64 slug chars)
                profile:
                  type: string
                  description: CI profile from flare.yml (job selection override; 1-64 slug chars)
      responses:
        '202':
          description: Run accepted (or short-circuited to a recorded verdict)
          content:
            application/json:
              schema:
                type: object
                required: [runId, jobIds]
                properties:
                  runId:
                    type: string
                  jobIds:
                    type: array
                    items:
                      type: string
                  reused:
                    type: boolean
                    description: True when the dispatch short-circuited to an attested verdict (no jobs ran)
                  receiptId:
                    type: string
                    description: Verdict receipt id (present when reused; see GET /v1/attestations/{receiptId})
                  verdict:
                    type: string
                    description: Recorded verdict replayed onto the run (present when reused)
  /v1/runs/dispatch/dry-run:
    post:
      tags: [runs]
      operationId: dryRunDispatch
      summary: Plan a dispatch (queued/blocked fan-out, priors, budget) with zero writes
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [repo, sha]
              properties:
                repo:
                  type: string
                  description: owner/name
                sha:
                  type: string
                  description: Commit SHA, branch, or tag (max 128 chars)
                ref:
                  type: string
                  description: Optional branch label (max 128 chars)
                pipeline:
                  type: string
                  description: Inline flare.yml (skips the repo fetch)
                source:
                  type: string
                  description: '"dry-run" placeholder or an uploaded working-tree id (requires inline pipeline; the tree is never fetched)'
                profile:
                  type: string
                  description: CI profile from flare.yml (job selection override; 1-64 slug chars)
      responses:
        '200':
          description: Dispatch plan (no run created)
          content:
            application/json:
              schema:
                type: object
                required: [repo, sha, branch, pipelineSource, profile, jobs, queued, blocked, skipped, totalPriorMs, paused, pausedAt, budget]
                properties:
                  repo:
                    type: string
                  sha:
                    type: string
                  branch:
                    type: string
                  pipelineSource:
                    type: string
                  profile:
                    type: string
                    nullable: true
                    description: Selected CI profile (null = every job ran unfiltered)
                  jobs:
                    type: array
                    items:
                      type: object
                      required: [name, base, needs, group, labels, status, blockedReason, wouldCancelInProgress, egressAllow, policyViolation, priorMs]
                      properties:
                        name:
                          type: string
                        base:
                          type: string
                        needs:
                          type: array
                          items:
                            type: string
                        group:
                          type: string
                          nullable: true
                        labels:
                          type: array
                          items:
                            type: string
                        status:
                          type: string
                          enum: [queued, blocked, skipped]
                        blockedReason:
                          type: string
                          nullable: true
                          enum: [needs, group, if, null]
                        wouldCancelInProgress:
                          type: boolean
                        egressAllow:
                          type: array
                          nullable: true
                          description: Effective outbound allowlist after the repo floor policy (null = observe-only)
                          items:
                            type: string
                        policyViolation:
                          type: string
                          nullable: true
                          description: Set when the job declares domains outside the repo allowlist (a real dispatch would reject)
                        priorMs:
                          type: integer
                  queued:
                    type: integer
                  blocked:
                    type: integer
                  skipped:
                    type: integer
                    description: Jobs skipped by a root `if:` that is already false
                  totalPriorMs:
                    type: integer
                  paused:
                    type: boolean
                  pausedAt:
                    type: string
                    nullable: true
                  budget:
                    nullable: true
                    type: object
                    required: [mode, usedMinutes, cap, wouldBlock]
                    properties:
                      mode:
                        type: string
                      usedMinutes:
                        type: integer
                      cap:
                        type: integer
                      wouldBlock:
                        type: boolean
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /v1/runs/{runId}:
    get:
      tags: [runs]
      operationId: getRun
      summary: Get a run with jobs and cost summary
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RunId'
      responses:
        '200':
          description: Run detail
          content:
            application/json:
              schema:
                type: object
                required: [run, jobs, summary]
                properties:
                  run:
                    $ref: '#/components/schemas/Run'
                  jobs:
                    type: array
                    items:
                      $ref: '#/components/schemas/Job'
                  summary:
                    $ref: '#/components/schemas/CostSummary'
                  race:
                    type: object
                    nullable: true
                    description: Race this run verifies, when it backs an agent attempt
                    properties:
                      tournament_id:
                        type: string
                      agent:
                        type: string
                      verdict_rank:
                        type: integer
                        nullable: true
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/runs/{runId}/wait:
    get:
      tags: [runs]
      operationId: waitRun
      summary: Block until the run is terminal (replaces poll loops)
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RunId'
        - name: timeout
          in: query
          schema:
            type: number
            minimum: 1
            maximum: 90
            default: 30
          description: Server-side wait budget in seconds
      responses:
        '200':
          description: Terminal (or timed-out) run state
          content:
            application/json:
              schema:
                type: object
                required: [run, jobs, summary, timedOut, waitedMs]
                properties:
                  run:
                    $ref: '#/components/schemas/Run'
                  jobs:
                    type: array
                    items:
                      $ref: '#/components/schemas/Job'
                  summary:
                    $ref: '#/components/schemas/CostSummary'
                  timedOut:
                    type: boolean
                  waitedMs:
                    type: number
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/runs/{runId}/digest:
    get:
      tags: [runs]
      operationId: getRunDigest
      summary: Token-efficient run digest for agents (no full logs)
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RunId'
      responses:
        '200':
          description: Structured digest with failing steps and triage
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunDigest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/repos:
    get:
      tags: [repos]
      operationId: listRepos
      summary: List Artifacts repositories in the bound namespace
      security:
        - bearerAuth: []
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
        - name: cursor
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Repositories filtered to the token scope
          content:
            application/json:
              schema:
                type: object
                required: [repos, total]
                properties:
                  repos:
                    type: array
                    items:
                      $ref: '#/components/schemas/RepoSummary'
                  total:
                    type: integer
                  cursor:
                    type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/repos/{repoName}:
    get:
      tags: [repos]
      operationId: getRepoInfo
      summary: Repository metadata plus head commit
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RepoName'
      responses:
        '200':
          description: Repo detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RepoDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/repos/{repoName}/tree:
    get:
      tags: [repos]
      operationId: getRepoTree
      summary: List a directory at a ref
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RepoName'
        - name: ref
          in: query
          schema:
            type: string
            default: main
        - name: path
          in: query
          schema:
            type: string
            default: ''
      responses:
        '200':
          description: Directory entries, directories first
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RepoTree'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/repos/{repoName}/blob:
    get:
      tags: [repos]
      operationId: getRepoBlob
      summary: Read a file at a ref (bounded, binary-flagged)
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RepoName'
        - name: ref
          in: query
          required: true
          schema:
            type: string
        - name: path
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: File content or truncation/binary flags
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RepoBlob'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/repos/{repoName}/commits:
    get:
      tags: [repos]
      operationId: getRepoCommits
      summary: Commit history at a ref, newest first
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RepoName'
        - name: ref
          in: query
          schema:
            type: string
            default: main
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: Commits newest first
          content:
            application/json:
              schema:
                type: object
                required: [commits]
                properties:
                  commits:
                    type: array
                    items:
                      $ref: '#/components/schemas/RepoCommit'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/tournaments:
    post:
      tags: [tournaments]
      operationId: createTournament
      summary: Open a tournament racing agents on one task
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [intent, sourceRepo]
              properties:
                intent:
                  type: string
                  description: Task description (1-2000 chars)
                sourceRepo:
                  type: string
                  description: Repo name in the bound Artifacts namespace
                baseRef:
                  type: string
                  description: Base branch (default main)
                baseSha:
                  type: string
                  description: Pinned base commit (optional)
      responses:
        '201':
          description: Tournament id
          content:
            application/json:
              schema:
                type: object
                required: [id]
                properties:
                  id:
                    type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    get:
      tags: [tournaments]
      operationId: listTournaments
      summary: List recent tournaments
      security:
        - bearerAuth: []
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: Tournaments newest first
          content:
            application/json:
              schema:
                type: object
                required: [tournaments]
                properties:
                  tournaments:
                    type: array
                    items:
                      $ref: '#/components/schemas/Tournament'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/tournaments/{tournamentId}:
    get:
      tags: [tournaments]
      operationId: getTournamentBoard
      summary: Tournament board (attempts, verdict, ledger)
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/TournamentId'
      responses:
        '200':
          description: Board state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TournamentBoard'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/tournaments/{tournamentId}/claims:
    post:
      tags: [tournaments]
      operationId: claimTournamentSlot
      summary: Claim an agent slot (forks the source)
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/TournamentId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [agent]
              properties:
                agent:
                  type: string
                  description: Agent label matching [\w.-]{1,40}
      responses:
        '201':
          description: Claim with fork repo + remote
          content:
            application/json:
              schema:
                type: object
                required: [attemptId, forkRepo, remote]
                properties:
                  attemptId:
                    type: string
                  forkRepo:
                    type: string
                  remote:
                    type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: Slot already claimed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '502':
          description: Fork failed upstream
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          $ref: '#/components/responses/NotConfigured'
  /v1/admin/tournaments/tick:
    post:
      tags: [tournaments]
      operationId: tickTournaments
      summary: Run one tournament-machine tick (admin)
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Per-pass counts
          content:
            application/json:
              schema:
                type: object
                required: [polled, verdicts, resolved, pushed]
                properties:
                  polled:
                    type: object
                    required: [dispatched, terminal]
                    properties:
                      dispatched:
                        type: integer
                      terminal:
                        type: integer
                  verdicts:
                    type: object
                    required: [decided]
                    properties:
                      decided:
                        type: integer
                  resolved:
                    type: object
                    required: [resolved]
                    properties:
                      resolved:
                        type: integer
                  pushed:
                    type: object
                    required: [pushed]
                    properties:
                      pushed:
                        type: integer
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/runs/{runId}/cancel:
    post:
      tags: [runs]
      operationId: cancelRun
      summary: Cancel a run's queued and blocked jobs
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RunId'
      responses:
        '200':
          description: Cancellation count
          content:
            application/json:
              schema:
                type: object
                required: [ok, cancelled]
                properties:
                  ok:
                    type: boolean
                  cancelled:
                    type: integer
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/runs/{runId}/status:
    post:
      tags: [jobs]
      operationId: postJobStatus
      summary: Executor status callback (running/terminal transitions)
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RunId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [jobId, status]
              properties:
                jobId:
                  type: string
                status:
                  type: string
                  enum: [running, success, failure, error, cancelled]
                log:
                  type: string
                  description: Full log (capped server-side at 256KB)
                result:
                  type: string
                  description: JSON step results (capped at 64KB)
      responses:
        '200':
          description: Recorded (dropped=true when the report belongs to a superseded execution)
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok:
                    type: boolean
                  dropped:
                    type: boolean
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/runs/{runId}/artifacts:
    get:
      tags: [artifacts]
      operationId: listRunArtifacts
      summary: List a run's artifacts across jobs
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RunId'
      responses:
        '200':
          description: Artifact entries
          content:
            application/json:
              schema:
                type: object
                required: [artifacts]
                properties:
                  artifacts:
                    type: array
                    items:
                      $ref: '#/components/schemas/Artifact'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '501':
          $ref: '#/components/responses/NotConfigured'
  /v1/runs/{runId}/tests:
    get:
      tags: [tests]
      operationId: getRunTests
      summary: Per-run JUnit rollup with failing cases
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RunId'
      responses:
        '200':
          description: Totals, per-job counts, and failing cases (max 50)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunTests'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
