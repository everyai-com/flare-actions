        '501':
          $ref: '#/components/responses/ForgeNotImplemented'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: API token (admin, runner, or readonly scope)
    cookieAuth:
      type: apiKey
      in: cookie
      name: flare_session
      description: Dashboard session cookie (admin routes, MCP, OAuth consent)
  parameters:
    ForgeIntentId:
      name: intentId
      in: path
      required: true
      schema:
        type: string
    ForgeConflictId:
      name: conflictId
      in: path
      required: true
      schema:
        type: string
    RunId:
      name: runId
      in: path
      required: true
      schema:
        type: string
    JobId:
      name: jobId
      in: path
      required: true
      schema:
        type: string
    TournamentId:
      name: tournamentId
      in: path
      required: true
      schema:
        type: string
    RepoName:
      name: repoName
      in: path
      required: true
      schema:
        type: string
    ReceiptId:
      name: receiptId
      in: path
      required: true
      schema:
        type: string
    MergeEntryId:
      name: entryId
      in: path
      required: true
      schema:
        type: string
    Limit50:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    Offset:
      name: offset
      in: query
      schema:
        type: integer
        minimum: 0
        maximum: 100000
        default: 0
  responses:
    ForgeConflict:
      description: State conflict (intent_not_claimable, not_pushable, not_ready, stale_state, lease_lost, goal_closed, conflict_not_claimable)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ForgeUnverified:
      description: 'push_unverified: the sha is not on the fork'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ForgeNotImplemented:
      description: 'not_implemented: capability not wired on this deployment (hint names the fallback)'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ForgeUpstream:
      description: 'fork_failed: Artifacts fork/token mint failed (claim released)'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    BadRequest:
      description: Invalid input
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Missing or invalid credentials
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: Valid credentials, out of scope
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Unknown id (or out-of-scope repo, indistinguishably)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    RateLimited:
      description: Too many attempts
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    TooLarge:
      description: Body exceeds the endpoint cap
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotConfigured:
      description: Optional binding not configured
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    ForgeNextSteps:
      type: array
      description: 'What to call next: MCP tool name (or `shell`), arguments, and why'
      items:
        type: object
        required:
          - tool
          - args
          - why
        properties:
          tool:
            type: string
          args:
            type: object
          why:
            type: string
    ForgeGoal:
      type: object
      required:
        - id
        - repo
        - text
        - state
      properties:
        id:
          type: string
        repo:
          type: string
        text:
          type: string
        createdBy:
          type: string
        state:
          type: string
          enum:
            - open
            - done
            - abandoned
        createdAt:
          type: string
        updatedAt:
          type: string
    ForgeIntent:
      type: object
      required:
        - id
        - repo
        - title
        - state
      properties:
        id:
          type: string
        goalId:
          type: string
          nullable: true
        repo:
          type: string
        agent:
          type: string
        title:
          type: string
        reasoning:
          type: string
        accept:
          type: string
        footprint:
          type: object
