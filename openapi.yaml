      type: object
      required: [id, repo, sha, profile, hash, verdict, runId, jobCount, jobs, createdAt, verified, verifyReason, runStatus]
      properties:
        id:
          type: string
          description: Receipt id (stable handle for cli attestation)
        repo:
          type: string
          description: owner/name — receipts never replay across repos
        sha:
          type: string
          description: Attested tree
        profile:
          type: string
          description: CI profile the verdict ran under (empty = all jobs)
        hash:
          type: string
          description: SHA-256 over repo + sha + profile + job set (names, definitions, labels)
