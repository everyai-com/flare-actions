            text/html:
              schema:
                type: string
  /:
    get:
      tags: [admin]
      operationId: root
      summary: Redirect to the dashboard
      security: []
      responses:
        '302':
          description: Redirect to /dashboard
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: API token (admin, runner, or readonly scope)
    cookieAuth:
      type: apiKey
      in: cookie
      name: flare_session
      description: Dashboard session cookie (admin routes, MCP, OAuth consent)
  parameters:
    RunId:
      name: runId
      in: path
      required: true
      schema:
        type: string
    JobId:
      name: jobId
      in: path
      required: true
      schema:
        type: string
    TournamentId:
      name: tournamentId
      in: path
      required: true
      schema:
        type: string
    ReceiptId:
      name: receiptId
      in: path
      required: true
      schema:
        type: string
    MergeEntryId:
      name: entryId
      in: path
      required: true
      schema:
        type: string
    Limit50:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    Offset:
      name: offset
      in: query
      schema:
        type: integer
        minimum: 0
        maximum: 100000
        default: 0
  responses:
    BadRequest:
      description: Invalid input
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Missing or invalid credentials
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: Valid credentials, out of scope
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Unknown id (or out-of-scope repo, indistinguishably)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    RateLimited:
      description: Too many attempts
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    TooLarge:
      description: Body exceeds the endpoint cap
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotConfigured:
      description: Optional binding not configured
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
        code:
          type: string
          description: Stable machine-actionable code (core lanes; see docs/ERRORS.md)
        hint:
          type: string
          description: Next step for the caller (present wherever code is)
    TemplateMeta:
      type: object
      required: [id, name, stack, description]
      properties:
        id:
          type: string
        name:
          type: string
        stack:
          type: string
        description:
          type: string
    Template:
      allOf:
        - $ref: '#/components/schemas/TemplateMeta'
        - type: object
          required: [yaml]
          properties:
            yaml:
              type: string
              description: Starter flare.yml for the template's stack
    FeedItem:
      type: object
      required: [run, failedJobs]
      properties:
        run:
          $ref: '#/components/schemas/Run'
        failedJobs:
          type: array
          description: Jobs in failure/error status (one-click rerun targets)
          items:
            type: object
            required: [id, name]
            properties:
              id:
                type: string
              name:
                type: string
    Tournament:
      type: object
      required: [id, intent, source_repo, state]
      properties:
        id:
          type: string
        intent:
          type: string
        source_repo:
          type: string
        base_ref:
          type: string
        base_sha:
          type: string
        state:
          type: string
          enum: [open, verifying, decided]
        winner_run_id:
          type: string
          nullable: true
        resolved_sha:
          type: string
          nullable: true
    TournamentAttempt:
      type: object
      required: [id, agent, fork_repo, state]
      properties:
        id:
          type: string
        agent:
          type: string
        fork_repo:
          type: string
        state:
          type: string
          enum: [claimed, pushing, verifying, terminal]
        last_seen_sha:
          type: string
        run_id:
          type: string
          nullable: true
        verdict_rank:
          type: integer
          nullable: true
    TournamentBoard:
      type: object
      required: [tournament, attempts, ledger]
      properties:
        tournament:
          $ref: '#/components/schemas/Tournament'
        attempts:
          type: array
          items:
            $ref: '#/components/schemas/TournamentAttempt'
        verdict:
          type: object
          nullable: true
        ledger:
          type: array
          items:
            type: object
    Ok:
      type: object
      required: [ok]
      properties:
        ok:
          type: boolean
    OAuthGrant:
      type: object
      required: [grantId, userId, clientId, scope]
      properties:
        grantId:
          type: string
        userId:
          type: string
        clientId:
          type: string
        clientName:
          type: string
          nullable: true
        scope:
          type: array
          items:
            type: string
        scopeDescriptions:
          type: array
          items:
            type: string
        createdAt:
          type: number
          nullable: true
    Run:
      type: object
      required: [id, repo, sha, event, status, created_at, updated_at]
      properties:
        id:
          type: string
        repo:
          type: string
        sha:
          type: string
        event:
          type: string
        agent:
          type: string
        installation_id:
          type: integer
          nullable: true
        branch:
          type: string
        source:
          type: string
          nullable: true
        pr_number:
          type: integer
          nullable: true
        pr_comment_id:
          type: integer
          nullable: true
        heal_branch:
          type: string
          nullable: true
        heal_pr_url:
          type: string
          nullable: true
        status:
          type: string
          enum: [queued, running, blocked, success, failure, error, cancelled, skipped]
        created_at:
          type: string
        updated_at:
          type: string
    Job:
      type: object
      required: [id, run_id, status]
      properties:
        id:
          type: string
        run_id:
          type: string
        name:
          type: string
        status:
          type: string
          enum: [queued, running, blocked, success, failure, error, cancelled, skipped]
        log:
          type: string
        definition:
          type: string
        result:
          type: string
        triage:
          type: string
        labels:
          type: string
        priority:
          type: integer
        attempts:
          type: integer
        started_at:
          type: string
          nullable: true
        finished_at:
          type: string
          nullable: true
        retained_until:
          type: string
          nullable: true
        prior_ms:
          type: integer
        created_at:
          type: string
        updated_at:
          type: string
        durationMs:
          type: number
          nullable: true
    CostSummary:
      type: object
      description: Cost attribution rollup for a run's jobs
    RunDigest:
      type: object
      required: [runId, repo, sha, branch, event, status, totalJobs, failedJobs, jobs]
      properties:
        runId:
          type: string
        repo:
          type: string
        sha:
          type: string
        branch:
          type: string
        event:
          type: string
        status:
          type: string
        durationMs:
          type: number
          nullable: true
        totalJobs:
          type: integer
        failedJobs:
          type: integer
        jobs:
          type: array
          items:
            $ref: '#/components/schemas/DigestJob'
        egress:
          $ref: '#/components/schemas/DigestEgress'
        heal:
          type: object
          properties:
            branch:
              type: string
            prUrl:
              type: string
        testSelection:
          type: object
          properties:
            jobs:
              type: integer
            selected:
              type: integer
            skipped:
              type: integer
        attestation:
          type: object
          description: Present when dispatch short-circuited to a recorded verdict (no jobs ran)
          properties:
            reused:
              type: boolean
            receiptId:
              type: string
            verdict:
              type: string
    Attestation:
      type: object
      required: [id, repo, sha, profile, hash, verdict, runId, jobCount, jobs, createdAt, verified, verifyReason, runStatus]
      properties:
        id:
          type: string
          description: Receipt id (stable handle for cli attestation)
        repo:
          type: string
          description: owner/name — receipts never replay across repos
        sha:
          type: string
          description: Attested tree
        profile:
          type: string
          description: CI profile the verdict ran under (empty = all jobs)
        hash:
          type: string
          description: SHA-256 over repo + sha + profile + job set (names, definitions, labels)
        verdict:
          type: string
          description: Recorded run verdict (success or failure)
        runId:
          type: string
          description: Witness run the verdict was recorded from
        jobCount:
          type: integer
        jobs:
          type: array
          items:
            type: object
            required: [name, status]
            properties:
              name:
                type: string
              status:
                type: string
        createdAt:
          type: string
        verified:
          type: boolean
          nullable: true
          description: Hash recomputed from the recorded run's live rows (null when the run was pruned)
        verifyReason:
          type: string
        runStatus:
          type: string
          nullable: true
          description: Current status of the witness run (null when pruned)
    MergeQueueEntry:
      type: object
      required: [id, repo, pr, baseBranch, headSha, baseSha, agent, status, runId, files, note, createdAt, updatedAt]
      properties:
        id:
          type: string
          description: Queue entry id (stable handle for cancel)
        repo:
          type: string
          description: owner/name
        pr:
          type: integer
          description: Pull request number
        baseBranch:
          type: string
          description: Branch the PR lands onto
        headSha:
          type: string
          description: PR head commit under verification
        baseSha:
          type: string
          description: Base head the entry is verified against (empty until first verify)
        agent:
          type: string
          description: Agent tag for attribution (empty when untagged)
        status:
          type: string
          enum: [queued, verifying, landed, failed, cancelled]
        runId:
          type: string
          nullable: true
          description: Live verification run (null when not verifying)
        files:
          type: array
          items:
            type: string
          description: PR file list feeding the collision radar (empty = unknown)
        note:
          type: string
          description: Human-visible state (verify target, re-queue reason, land outcome)
        createdAt:
          type: string
        updatedAt:
          type: string
    MergeCollision:
      type: object
      required: [entries, prs, paths]
      properties:
        entries:
          type: array
          minItems: 2
          maxItems: 2
          items:
            type: string
          description: Colliding queue entry ids
        prs:
          type: array
          minItems: 2
          maxItems: 2
          items:
            type: integer
          description: Colliding PR numbers
        paths:
          type: array
          items:
            type: string
          description: Shared files (bounded to 10)
    DigestSelection:
      type: object
      required: [mode, reason, selected, skipped]
      properties:
        mode:
          type: string
        reason:
          type: string
        selected:
          type: integer
        skipped:
          type: integer
    DigestJob:
      type: object
      required: [id, name, status, stepCount]
      properties:
        id:
          type: string
        name:
          type: string
        status:
          type: string
        durationMs:
          type: number
          nullable: true
        stepCount:
          type: integer
        failing:
          $ref: '#/components/schemas/DigestStep'
        triage:
          type: string
        retainedUntil:
          type: string
        selection:
          $ref: '#/components/schemas/DigestSelection'
        peakRssBytes:
          type: integer
          description: Peak RSS self-reported by the executor (absent when unmeasured)
        sizeHint:
          type: string
          description: Right-sizing label for the peak (size-s/m/l/xl); present iff measured
    DigestStep:
      type: object
      required: [command, exitCode, durationMs, outputTail]
      properties:
        command:
          type: string
        exitCode:
          type: number
        durationMs:
          type: number
        outputTail:
          type: string
    DigestEgress:
      type: object
      required: [reqBytes, respBytes, topHosts]
      properties:
        reqBytes:
          type: number
        respBytes:
          type: number
        topHosts:
          type: array
          items:
            type: object
            required: [host, reqBytes, respBytes]
            properties:
              host:
                type: string
              reqBytes:
                type: number
              respBytes:
                type: number
    Artifact:
      type: object
      description: Artifact entry (job id, name, size)
    FlakyStat:
      type: object
      description: Per-job failure rate row (job, runs, failures, rate)
    MergedPrWeek:
      type: object
      description: One merge week (Monday start, merged count, CI minutes, list dollars, per-PR minutes)
      required: [week, mergedPrs, computeMinutes, actionsListUsd, costPerPrMinutes]
      properties:
        week:
          type: string
          description: Monday date YYYY-MM-DD
        mergedPrs:
          type: integer
        computeMinutes:
          type: number
        actionsListUsd:
          type: number
        costPerPrMinutes:
          type: number
    QuarantineCandidate:
      type: object
      description: Suggested quarantine (name, reason, 14-run history sparkline)
      required: [name, reason, sparkline]
      properties:
        name:
          type: string
        reason:
          type: string
        sparkline:
          type: string
          description: Oldest-to-newest statuses (● pass, ○ fail, · other)
    UsageStats:
      type: object
      description: Compute minutes and cost attribution rollup
      properties:
        githubRunnerJobs:
          type: integer
          description: Completed runner-mode jobs in the window
        githubRunnerMinutes:
          type: number
          description: Runner-mode compute minutes in the window
        githubRunnerListUsd:
          type: number
          description: Runner-mode minutes at Actions list price
    GithubRunnerJob:
      type: object
      required: [id, repo, runId, jobName, labels, status, attempts]
      properties:
        id:
          type: string
          description: GitHub workflow_job id
        repo:
          type: string
        runId:
          type: string
        runAttempt:
          type: integer
        jobName:
          type: string
        workflowName:
          type: string
        headSha:
          type: string
        labels:
          type: array
          items:
            type: string
        status:
          type: string
          enum: [queued, claimed, running, completed]
        conclusion:
          type: string
          nullable: true
        runnerId:
          type: integer
          nullable: true
        runnerName:
          type: string
        attempts:
          type: integer
        startedAt:
          type: string
          nullable: true
        completedAt:
          type: string
          nullable: true
    LogHit:
      type: object
      description: FTS log match (run, job, line, rank)
    ByteTotals:
      type: object
      required: [reqBytes, respBytes]
      properties:
        reqBytes:
          type: number
        respBytes:
          type: number
    RunSelection:
      type: object
      required: [runId, jobs]
      properties:
        runId:
          type: string
        jobs:
          type: array
          items:
            $ref: '#/components/schemas/SelectionJob'
    SelectionJob:
      type: object
      required: [jobId, jobName, mode, reason, selectedCount, skippedCount, selected, skipped]
      properties:
        jobId:
          type: string
        jobName:
          type: string
        mode:
          type: string
          description: select (ran a subset) or full (ran everything)
        reason:
          type: string
        selectedCount:
          type: integer
        skippedCount:
          type: integer
        selected:
          type: array
          items:
            type: string
        skipped:
          type: array
          items:
            type: object
            required: [file, reason]
            properties:
              file:
                type: string
              reason:
                type: string
    RunTests:
      type: object
      required: [runId, totals, jobs, failing]
      properties:
        runId:
          type: string
        totals:
          $ref: '#/components/schemas/TestTotals'
        jobs:
          type: array
          items:
            $ref: '#/components/schemas/JobTestCounts'
        failing:
          type: array
          items:
            $ref: '#/components/schemas/FailingTest'
    TestTotals:
      type: object
      required: [total, passed, failed, errors, skipped]
      properties:
        total:
          type: integer
        passed:
          type: integer
        failed:
          type: integer
        errors:
          type: integer
        skipped:
          type: integer
    JobTestCounts:
      type: object
      required: [jobId, jobName, total, passed, failed, errors, skipped]
      properties:
        jobId:
          type: string
        jobName:
          type: string
        total:
          type: integer
        passed:
          type: integer
        failed:
          type: integer
        errors:
          type: integer
        skipped:
          type: integer
        durationMs:
          type: number
        truncated:
          type: boolean
    FailingTest:
      type: object
      required: [jobId, jobName, name, status]
      properties:
        jobId:
          type: string
        jobName:
          type: string
        suite:
          type: string
        name:
          type: string
        classname:
          type: string
        status:
          type: string
        message:
          type: string
    ApiToken:
      type: object
      required: [id, name, scopes]
      properties:
        id:
          type: string
        name:
          type: string
        scopes:
          type: array
          items:
            type: string
        repos:
          type: array
          items:
            type: string
        created_at:
          type: string
        revoked_at:
          type: string
          nullable: true
    Settings:
      type: object
      description: Dashboard settings snapshot (see GET /v1/admin/settings)
    EmailUser:
      type: object
      required: [email, isAdmin, createdAt]
      properties:
        email:
          type: string
        isAdmin:
          type: boolean
        createdAt:
          type: string
    AuditEntry:
      type: object
      required: [id, actor, action, created_at]
      properties:
        id:
          type: string
        actor:
          type: string
        action:
          type: string
        target:
          type: string
        created_at:
          type: string
    QueuedJob:
      type: object
      required: [id, runId, name, repo]
      properties:
        id:
          type: string
        runId:
          type: string
        name:
          type: string
        repo:
          type: string
        agent:
          type: string
        priority:
          type: integer
        priorMs:
          type: number
        labels:
          type: string
        createdAt:
          type: string
    Schedule:
      type: object
      required: [id, repo, ref, cron, enabled]
      properties:
        id:
          type: string
        repo:
          type: string
        ref:
          type: string
        cron:
          type: string
        profile:
          type: string
          nullable: true
          description: Pinned CI profile for the firing run (null = pipeline schedule default, else all jobs)
        enabled:
          type: boolean
        lastRunAt:
          type: string
          nullable: true
        createdAt:
          type: string
    Monitor:
      type: object
      required: [id, repo, trigger, enabled]
      properties:
        id:
          type: string
        name:
          type: string
        repo:
          type: string
        branch:
          type: string
        job:
          type: string
        trigger:
          type: string
          enum: [result, duration]
        result:
          type: string
        consecutive:
          type: integer
        durationSeconds:
          type: number
        logPattern:
          type: string
        webhookSet:
          type: boolean
        enabled:
          type: boolean
        mutedUntil:
          type: string
          nullable: true
        streak:
          type: integer
        lastFiredAt:
          type: string
          nullable: true
        createdAt:
          type: string
    MonitorInput:
      type: object
      required: [repo, trigger]
      properties:
        name:
          type: string
        repo:
          type: string
        branch:
          type: string
        job:
          type: string
          description: Glob string (max 128 chars)
        trigger:
          type: string
          enum: [result, duration]
        result:
          type: string
        consecutive:
          type: integer
        durationSeconds:
          type: number
        logPattern:
          type: string
        webhookUrl:
          type: string
    JsonRpcRequest:
      type: object
      required: [jsonrpc, method]
      properties:
        jsonrpc:
          type: string
          enum: ['2.0']
        id:
          type: number
        method:
          type: string
        params:
          type: object
    JsonRpcResponse:
      type: object
      required: [jsonrpc, id]
      properties:
        jsonrpc:
          type: string
          enum: ['2.0']
        id:
          type: number
        result:
          type: object
        error:
          type: object
