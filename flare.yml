# Flare Actions dogfoods itself: every push to this repo runs the same
# gates as CI on Flare runners (GitHub Actions runs the same steps as
# a backstop — see .github/workflows/ci.yml).
jobs:
  verify:
    steps:
      - run: node --version && npm --version
      - run: npm ci
      - run: npm run types
      - run: npm run typecheck
      - run: npm test
      - run: npm run deploy:dry
      - run: npx wrangler deploy --dry-run --config apps/seats/wrangler.jsonc
