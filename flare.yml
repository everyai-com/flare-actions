# Flare Actions dogfoods itself: every push to this repo runs the same
# gates as CI on Flare runners (GitHub Actions runs the same steps as
# a backstop — see .github/workflows/ci.yml).
jobs:
  verify:
    steps:
      - run: node --version && npm --version
      # Seats showed npm ci hanging silently to the 10m step cap: log
      # HTTP progress so a stall is diagnosable, skip audit/fund round
      # trips, and allow a cold cache more room.
      - run: npm ci --prefer-offline --no-audit --no-fund --loglevel=http
        timeout-minutes: 20
      - run: npm run types
      - run: npm run typecheck
      - run: npm test
      - run: npm run deploy:dry
      - run: node -e "const fs=require('fs');fs.writeFileSync('apps/seats/wrangler.jsonc',fs.readFileSync('apps/seats/wrangler.jsonc.example','utf8').replace('__ACCOUNT_ID__','0123456789abcdef0123456789abcdef'))"
      - run: npx wrangler deploy --dry-run --config apps/seats/wrangler.jsonc
